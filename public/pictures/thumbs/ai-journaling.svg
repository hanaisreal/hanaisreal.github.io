<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <!-- AI journaling: typing rhythm on the left becomes a generative
       watercolor atmosphere on the right. -->
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.26  0 0 0 0.06 0"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f3"/>
      <stop offset="1" stop-color="#f4eee6"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#paper)"/>

  <!-- journal page -->
  <rect x="36" y="44" width="262" height="312" rx="6" fill="#fffdf9" stroke="#d9cfc2"/>
  <text x="58" y="78" font-family="Georgia, serif" font-size="15" fill="#6b5848" font-style="italic">tonight</text>
  <g fill="#cbbfb1">
    <rect x="58" y="96" width="206" height="7" rx="3.5"/>
    <rect x="58" y="114" width="172" height="7" rx="3.5"/>
    <rect x="58" y="132" width="214" height="7" rx="3.5"/>
    <rect x="58" y="150" width="120" height="7" rx="3.5"/>
    <rect x="58" y="178" width="196" height="7" rx="3.5"/>
    <rect x="58" y="196" width="150" height="7" rx="3.5"/>
  </g>
  <!-- typing rhythm: pauses and bursts under the words -->
  <g fill="#8a6f5c">
    <rect x="58"  y="276" width="5" height="18" rx="2.5"/>
    <rect x="68"  y="268" width="5" height="34" rx="2.5"/>
    <rect x="78"  y="280" width="5" height="10" rx="2.5"/>
    <rect x="88"  y="262" width="5" height="46" rx="2.5"/>
    <rect x="98"  y="272" width="5" height="26" rx="2.5"/>
    <rect x="124" y="282" width="5" height="6"  rx="2.5"/>
    <rect x="134" y="278" width="5" height="14" rx="2.5"/>
    <rect x="144" y="266" width="5" height="38" rx="2.5"/>
    <rect x="154" y="258" width="5" height="54" rx="2.5"/>
    <rect x="164" y="270" width="5" height="30" rx="2.5"/>
    <rect x="174" y="276" width="5" height="18" rx="2.5"/>
    <rect x="206" y="283" width="5" height="4"  rx="2"/>
    <rect x="216" y="274" width="5" height="22" rx="2.5"/>
    <rect x="226" y="264" width="5" height="42" rx="2.5"/>
    <rect x="236" y="276" width="5" height="18" rx="2.5"/>
    <rect x="246" y="281" width="5" height="8"  rx="2.5"/>
  </g>
  <text x="58" y="336" font-family="Georgia, serif" font-size="12" fill="#9a8878" font-style="italic">typing rhythm</text>

  <!-- flow from rhythm into atmosphere -->
  <path d="M300 285 C 340 285, 350 210, 392 205" fill="none" stroke="#a89484" stroke-width="1.6" stroke-dasharray="4 5"/>
  <path d="M386 199 L 394 205 L 385 210" fill="none" stroke="#a89484" stroke-width="1.6" stroke-linecap="round"/>

  <!-- generative canvas -->
  <rect x="340" y="44" width="264" height="312" rx="6" fill="#fffdf9" stroke="#d9cfc2"/>
  <clipPath id="canvas"><rect x="341" y="45" width="262" height="310" rx="5"/></clipPath>
  <g clip-path="url(#canvas)" filter="url(#soft)">
    <circle cx="430" cy="140" r="78" fill="#e9a27c" opacity="0.75"/>
    <circle cx="520" cy="118" r="62" fill="#b9a3d6" opacity="0.7"/>
    <circle cx="500" cy="250" r="86" fill="#f2c98c" opacity="0.7"/>
    <circle cx="400" cy="290" r="64" fill="#8fb3c9" opacity="0.6"/>
    <circle cx="560" cy="320" r="50" fill="#d98a9a" opacity="0.55"/>
  </g>
  <rect x="341" y="45" width="262" height="310" rx="5" filter="url(#grain)"/>
  <text x="362" y="336" font-family="Georgia, serif" font-size="12" fill="#6b5848" font-style="italic">atmosphere of the day</text>
</svg>
