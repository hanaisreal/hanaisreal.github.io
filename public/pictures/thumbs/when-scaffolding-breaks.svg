<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <!-- When Scaffolding Breaks: an essay, a student-AI chat, and a scaffold with a broken rung. -->
  <defs><filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.26  0 0 0 0.05 0"/></filter><linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#f4eee6"/></linearGradient></defs><rect width="640" height="400" fill="url(#paper)"/>
  <g filter="url(#soft)" opacity="0.7">
    <circle cx="130" cy="150" r="78" fill="#8fb3c9"/>
    <circle cx="520" cy="210" r="84" fill="#e9a27c"/>
  </g>
  <!-- essay page -->
  <rect x="44" y="52" width="170" height="296" rx="6" fill="#fffdf9" stroke="#d9cfc2"/>
  <text x="62" y="84" font-family="Georgia, serif" font-size="13" fill="#6b5848" font-style="italic">my essay</text>
  <g fill="#cbbfb1">
    <rect x="62" y="102" width="134" height="7" rx="3.5"/>
    <rect x="62" y="120" width="120" height="7" rx="3.5"/>
    <rect x="62" y="138" width="130" height="7" rx="3.5"/>
    <rect x="62" y="156" width="96" height="7" rx="3.5"/>
  </g>
  <g fill="#e7ddd1">
    <rect x="62" y="186" width="134" height="7" rx="3.5"/>
    <rect x="62" y="204" width="110" height="7" rx="3.5"/>
    <rect x="62" y="222" width="126" height="7" rx="3.5"/>
  </g>
  <!-- chat -->
  <g stroke="#3b3029" stroke-width="1.6">
    <rect x="252" y="70" width="150" height="46" rx="12" fill="#fffdf9"/>
    <rect x="232" y="132" width="150" height="58" rx="12" fill="#e8eef3"/>
    <rect x="252" y="206" width="150" height="46" rx="12" fill="#fffdf9"/>
    <rect x="232" y="268" width="150" height="58" rx="12" fill="#e8eef3"/>
  </g>
  <g fill="#b3a79b">
    <rect x="266" y="86" width="110" height="6" rx="3"/><rect x="266" y="100" width="70" height="6" rx="3"/>
    <rect x="246" y="148" width="120" height="6" rx="3"/><rect x="246" y="162" width="96" height="6" rx="3"/><rect x="246" y="176" width="60" height="6" rx="3"/>
    <rect x="266" y="222" width="100" height="6" rx="3"/><rect x="266" y="236" width="80" height="6" rx="3"/>
    <rect x="246" y="284" width="116" height="6" rx="3"/><rect x="246" y="298" width="84" height="6" rx="3"/>
  </g>
  <!-- scaffold with a broken rung -->
  <g stroke="#3b3029" stroke-width="3" stroke-linecap="round">
    <line x1="470" y1="60" x2="470" y2="340"/>
    <line x1="570" y1="60" x2="570" y2="340"/>
    <line x1="470" y1="100" x2="570" y2="100"/>
    <line x1="470" y1="150" x2="570" y2="150"/>
    <line x1="470" y1="250" x2="570" y2="250"/>
    <line x1="470" y1="300" x2="570" y2="300"/>
    <line x1="470" y1="200" x2="510" y2="190"/>
    <line x1="530" y1="214" x2="570" y2="200"/>
  </g>
  <g stroke="#3b3029" stroke-width="1.2" opacity="0.5">
    <line x1="470" y1="100" x2="570" y2="150"/><line x1="470" y1="250" x2="570" y2="300"/>
  </g>
  <text x="520" y="372" font-family="Georgia, serif" font-size="13" fill="#6b5848" font-style="italic" text-anchor="middle">where support breaks</text>
  <rect width="640" height="400" filter="url(#grain)"/>
</svg>
