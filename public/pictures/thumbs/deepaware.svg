<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <!-- DeepAware: the learner's own face placed into a simulated scam, then coping. -->
  <defs><filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.26  0 0 0 0.05 0"/></filter><linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#f4eee6"/></linearGradient></defs><rect width="640" height="400" fill="url(#paper)"/>
  <g filter="url(#soft)" opacity="0.7">
    <circle cx="140" cy="170" r="80" fill="#f2c98c"/>
    <circle cx="330" cy="220" r="96" fill="#d98a9a"/>
    <circle cx="520" cy="190" r="74" fill="#9cc2a0"/>
  </g>
  <!-- the learner's photo -->
  <rect x="68" y="96" width="144" height="170" rx="6" fill="#fffdf9" stroke="#3b3029" stroke-width="1.8"/>
  <circle cx="140" cy="160" r="30" fill="#efe4d8" stroke="#3b3029" stroke-width="1.8"/>
  <path d="M92 250 Q140 196 188 250" fill="#efe4d8" stroke="#3b3029" stroke-width="1.8"/>
  <text x="140" y="292" font-family="Georgia, serif" font-size="13" fill="#6b5848" font-style="italic" text-anchor="middle">your face and voice</text>
  <!-- arrow -->
  <path d="M222 180 C 240 180, 246 180, 262 180" fill="none" stroke="#3b3029" stroke-width="1.8"/>
  <path d="M256 174 L264 180 L256 186" fill="none" stroke="#3b3029" stroke-width="1.8" stroke-linecap="round"/>
  <!-- phone with the simulated scam -->
  <rect x="272" y="46" width="130" height="300" rx="20" fill="#fffdf9" stroke="#3b3029" stroke-width="2"/>
  <rect x="286" y="78" width="102" height="118" rx="4" fill="#efe4d8" stroke="#3b3029" stroke-width="1.4"/>
  <circle cx="337" cy="124" r="20" fill="#f7efe6" stroke="#3b3029" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M305 196 Q337 158 369 196" fill="#f7efe6" stroke="#3b3029" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g stroke="#d98a9a" stroke-width="1.2" opacity="0.8">
    <line x1="290" y1="104" x2="384" y2="104"/><line x1="290" y1="132" x2="384" y2="132"/><line x1="290" y1="160" x2="384" y2="160"/>
  </g>
  <circle cx="376" cy="90" r="5" fill="#d9534f"/>
  <g fill="#cbbfb1">
    <rect x="288" y="214" width="98" height="7" rx="3.5"/>
    <rect x="288" y="232" width="80" height="7" rx="3.5"/>
    <rect x="288" y="250" width="92" height="7" rx="3.5"/>
  </g>
  <circle cx="337" cy="300" r="18" fill="#fffdf9" stroke="#3b3029" stroke-width="1.6"/>
  <path d="M332 291 L346 300 L332 309 Z" fill="#3b3029"/>
  <!-- warning badge -->
  <circle cx="404" cy="62" r="17" fill="#fffdf9" stroke="#bf4a3a" stroke-width="2"/>
  <text x="404" y="69" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#bf4a3a" text-anchor="middle">!</text>
  <!-- dotted arrow to coping -->
  <path d="M412 200 C 438 200, 444 200, 460 200" fill="none" stroke="#3b3029" stroke-width="1.6" stroke-dasharray="4 5"/>
  <path d="M454 194 L462 200 L454 206" fill="none" stroke="#3b3029" stroke-width="1.6" stroke-linecap="round"/>
  <!-- shield -->
  <path d="M520 118 L574 138 L574 196 C 574 238, 546 262, 520 274 C 494 262, 466 238, 466 196 L466 138 Z" fill="#fffdf9" stroke="#3b3029" stroke-width="2"/>
  <path d="M496 196 L514 214 L548 176" fill="none" stroke="#3b3029" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="520" y="306" font-family="Georgia, serif" font-size="13" fill="#6b5848" font-style="italic" text-anchor="middle">coping</text>
  <rect width="640" height="400" filter="url(#grain)"/>
</svg>
