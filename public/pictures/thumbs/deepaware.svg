<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <!-- DeepAware, as a paper-style schematic: learner input -> self-relevant
       deepfake simulation -> measured outcomes. -->
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- panels -->
  <g fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5">
    <rect x="24" y="48" width="168" height="304" rx="10"/>
    <rect x="236" y="48" width="168" height="304" rx="10"/>
    <rect x="448" y="48" width="168" height="304" rx="10"/>
  </g>
  <g font-size="11" font-weight="600" letter-spacing="0.08em" fill="#64748b">
    <text x="40" y="76">1  LEARNER INPUT</text>
    <text x="252" y="76">2  SIMULATION</text>
    <text x="464" y="76">3  OUTCOMES</text>
  </g>

  <!-- 1: face and voice -->
  <rect x="58" y="96" width="100" height="112" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <clipPath id="photo"><rect x="58" y="96" width="100" height="112" rx="6"/></clipPath>
  <g clip-path="url(#photo)" fill="#94a3b8">
    <circle cx="108" cy="140" r="22"/>
    <path d="M62 212 C 66 176, 150 176, 154 212 Z"/>
  </g>
  <text x="108" y="228" font-size="12" fill="#334155" text-anchor="middle">Face</text>
  <g fill="#475569">
    <rect x="62" y="262" width="4" height="12" rx="2"/><rect x="70" y="256" width="4" height="24" rx="2"/>
    <rect x="78" y="250" width="4" height="36" rx="2"/><rect x="86" y="258" width="4" height="20" rx="2"/>
    <rect x="94" y="246" width="4" height="44" rx="2"/><rect x="102" y="254" width="4" height="28" rx="2"/>
    <rect x="110" y="260" width="4" height="16" rx="2"/><rect x="118" y="250" width="4" height="36" rx="2"/>
    <rect x="126" y="256" width="4" height="24" rx="2"/><rect x="134" y="262" width="4" height="12" rx="2"/>
    <rect x="142" y="258" width="4" height="20" rx="2"/><rect x="150" y="263" width="4" height="10" rx="2"/>
  </g>
  <text x="108" y="310" font-size="12" fill="#334155" text-anchor="middle">Voice</text>

  <!-- arrows -->
  <g stroke="#94a3b8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M198 200 H228"/><path d="M222 194 L229 200 L222 206"/>
    <path d="M410 200 H440"/><path d="M434 194 L441 200 L434 206"/>
  </g>

  <!-- 2: phone with a self-relevant fake news clip -->
  <rect x="266" y="92" width="108" height="214" rx="16" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <rect x="302" y="100" width="36" height="5" rx="2.5" fill="#1e293b"/>
  <text x="278" y="126" font-size="9" font-weight="700" letter-spacing="0.1em" fill="#1e293b">NEWS</text>
  <rect x="278" y="134" width="84" height="84" rx="4" fill="#e2e8f0"/>
  <clipPath id="clip"><rect x="278" y="134" width="84" height="84" rx="4"/></clipPath>
  <g clip-path="url(#clip)">
    <g fill="#94a3b8"><circle cx="320" cy="168" r="17"/><path d="M288 222 C 292 192, 348 192, 352 222 Z"/></g>
    <g stroke="#ffffff" stroke-width="1" opacity="0.7">
      <line x1="278" y1="146" x2="362" y2="146"/><line x1="278" y1="158" x2="362" y2="158"/>
      <line x1="278" y1="170" x2="362" y2="170"/><line x1="278" y1="182" x2="362" y2="182"/>
      <line x1="278" y1="194" x2="362" y2="194"/><line x1="278" y1="206" x2="362" y2="206"/>
    </g>
  </g>
  <circle cx="320" cy="176" r="12" fill="#ffffff" opacity="0.92"/>
  <path d="M316 169 L326 176 L316 183 Z" fill="#1e293b"/>
  <rect x="278" y="226" width="56" height="16" rx="8" fill="#dc2626"/>
  <text x="306" y="238" font-size="9" font-weight="700" letter-spacing="0.06em" fill="#ffffff" text-anchor="middle">DEEPFAKE</text>
  <g fill="#cbd5e1">
    <rect x="278" y="252" width="84" height="6" rx="3"/><rect x="278" y="266" width="70" height="6" rx="3"/>
    <rect x="278" y="280" width="78" height="6" rx="3"/>
  </g>
  <text x="320" y="334" font-size="11" fill="#64748b" text-anchor="middle">Learner's own face and voice</text>

  <!-- 3: outcomes -->
  <g font-size="13" fill="#334155">
    <g transform="translate(466 120)">
      <circle cx="10" cy="10" r="10" fill="#1f5fbf"/><path d="M5 10 L9 14 L15 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="15">Knowledge</text>
    </g>
    <g transform="translate(466 176)">
      <circle cx="10" cy="10" r="10" fill="#1f5fbf"/><path d="M5 10 L9 14 L15 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="9">Perceived</text><text x="28" y="25">vulnerability</text>
    </g>
    <g transform="translate(466 240)">
      <circle cx="10" cy="10" r="10" fill="#1f5fbf"/><path d="M5 10 L9 14 L15 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="9">Coping</text><text x="28" y="25">confidence</text>
    </g>
  </g>
  <text x="532" y="334" font-size="11" fill="#64748b" text-anchor="middle">21 older adults</text>
</svg>
