<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <!-- AI Communication Mediator: two people meet on shared, grounded facts. -->
  <defs><filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.26  0 0 0 0.05 0"/></filter><linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#f4eee6"/></linearGradient></defs><rect width="640" height="400" fill="url(#paper)"/>
  <g filter="url(#soft)" opacity="0.7">
    <circle cx="120" cy="150" r="80" fill="#8fb3c9"/>
    <circle cx="520" cy="150" r="80" fill="#d98a9a"/>
    <circle cx="320" cy="250" r="70" fill="#f2c98c"/>
  </g>
  <!-- speech bubbles -->
  <g stroke="#3b3029" stroke-width="1.8" stroke-linejoin="round">
    <path d="M52 70 H212 A12 12 0 0 1 224 82 V146 A12 12 0 0 1 212 158 H112 L92 180 L96 158 H64 A12 12 0 0 1 52 146 V82 A12 12 0 0 1 64 70 Z" fill="#fffdf9"/>
    <path d="M416 70 H576 A12 12 0 0 1 588 82 V146 A12 12 0 0 1 576 158 H544 L548 180 L528 158 H428 A12 12 0 0 1 416 146 V82 A12 12 0 0 1 428 70 Z" fill="#fffdf9"/>
  </g>
  <g fill="#b3a79b">
    <rect x="70" y="92" width="130" height="7" rx="3.5"/><rect x="70" y="110" width="104" height="7" rx="3.5"/><rect x="70" y="128" width="120" height="7" rx="3.5"/>
    <rect x="434" y="92" width="130" height="7" rx="3.5"/><rect x="434" y="110" width="96" height="7" rx="3.5"/><rect x="434" y="128" width="118" height="7" rx="3.5"/>
  </g>
  <!-- people -->
  <g fill="#efe4d8" stroke="#3b3029" stroke-width="1.8">
    <circle cx="96" cy="236" r="26"/><path d="M50 340 Q96 270 142 340 Z"/>
    <circle cx="544" cy="236" r="26"/><path d="M498 340 Q544 270 590 340 Z"/>
  </g>
  <!-- shared document -->
  <path d="M262 180 H362 L382 200 V340 H262 Z" fill="#fffdf9" stroke="#3b3029" stroke-width="2"/>
  <path d="M362 180 V200 H382" fill="none" stroke="#3b3029" stroke-width="1.6"/>
  <g fill="#cbbfb1">
    <rect x="278" y="212" width="88" height="6" rx="3"/><rect x="278" y="248" width="80" height="6" rx="3"/>
    <rect x="278" y="266" width="88" height="6" rx="3"/><rect x="278" y="284" width="60" height="6" rx="3"/><rect x="278" y="302" width="84" height="6" rx="3"/>
  </g>
  <rect x="274" y="226" width="96" height="14" rx="3" fill="#f2c98c" opacity="0.8"/>
  <rect x="278" y="230" width="84" height="6" rx="3" fill="#8a6f5c"/>
  <!-- links to the shared fact -->
  <path d="M190 158 C 220 200, 240 226, 272 232" fill="none" stroke="#3b3029" stroke-width="1.6" stroke-dasharray="4 5"/>
  <path d="M450 158 C 420 200, 400 226, 372 232" fill="none" stroke="#3b3029" stroke-width="1.6" stroke-dasharray="4 5"/>
  <text x="322" y="368" font-family="Georgia, serif" font-size="13" fill="#6b5848" font-style="italic" text-anchor="middle">shared facts</text>
  <rect width="640" height="400" filter="url(#grain)"/>
</svg>
